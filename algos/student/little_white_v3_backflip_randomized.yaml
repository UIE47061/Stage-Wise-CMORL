name: student
teacher:
    algo_name: comoppo
    seed: 24
    model_num: 100000000

# Per-episode selection, not action blending. All states receive teacher labels.
student_rollout:
    warmup_steps: 1000000
    ramp_steps: 1000000
    max_student_probability: 1.0

n_steps: 10000
batch_size: 10000
replay_size: 1000000
max_grad_norm: 1.0
actor_lr: 1e-4
reset_actor_lr_on_resume: true
n_actor_iters: 100
backup_files: [main_student.py, utils/student_rollout.py, algos/student/agent.py, algos/student/normalizer.py, algos/student/storage.py, algos/student/little_white_v3_backflip_randomized.yaml]
logging:
    task_indep: [fps, eplen, fail, actor_loss]
    reward_dep: [reward_sum]
    cost_dep: [cost_sum]
model:
    actor:
        mlp:
            shape: [256, 128, 64]
            activation: ELU
        use_action_bound: false
        log_std_init: 0.0
        log_std_fix: true
